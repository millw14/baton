[package]
name = "baton"
version = "0.1.0"
edition = "2021"
description = "One declarative config for your whole Windows desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"

[dependencies.windows]
version = "=0.58.0"
features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
strip = true
