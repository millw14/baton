# baton - one declarative config for your whole Windows desktop
#
# Lives at ~/.config/baton/baton.toml
# Validate with `baton check`, preview with `baton diff`, apply with `baton apply`.

[meta]
name = "my desktop"

# Declare every colour once. Reference it anywhere below as "@palette.<name>"
# and Baton substitutes it before handing the value to a target. Change a
# colour here and it propagates to every tool at once.
[palette]
bg       = "#24273a"
fg       = "#cad3f5"
accent   = "#8aadf4"
inactive = "#494d64"
urgent   = "#ed8796"


# --------------------------------------------------------------------------
# Window management. Rendered into the backend's own config format.
# backend = "glazewm" | "winrice" | "none"
# --------------------------------------------------------------------------
[wm]
backend = "glazewm"
workspaces = ["1", "2", "3", "4", "5"]
focus_follows_cursor = false
focused_border = "@palette.accent"

[wm.gaps]
inner = 10
outer = 10

[wm.keys]
"alt+h" = "focus --direction left"
"alt+j" = "focus --direction down"
"alt+k" = "focus --direction up"
"alt+l" = "focus --direction right"
"alt+shift+h" = "move --direction left"
"alt+shift+j" = "move --direction down"
"alt+shift+k" = "move --direction up"
"alt+shift+l" = "move --direction right"
"alt+1" = "focus --workspace 1"
"alt+2" = "focus --workspace 2"
"alt+3" = "focus --workspace 3"
"alt+4" = "focus --workspace 4"
"alt+5" = "focus --workspace 5"
"alt+shift+q" = "close"
"alt+enter" = "shell-exec powershell.exe"


# --------------------------------------------------------------------------
# Status bar.  backend = "zebar" | "none"
#
# Zebar gets its widgets from marketplace packs, so what baton owns here is
# which widgets launch -- not what they look like, since pack internals are
# replaced on every pack update.
#
# For theming, baton writes your palette to
# ~/.glzr/zebar/baton-palette.css as CSS custom properties. Import it from
# your own widget pack to pick up every colour:
#
#   @import '../../baton-palette.css';
#   .bar { background: var(--bg); color: var(--fg); }
#
# Leave backend = "none" (the default) and baton will not touch your bar.
# --------------------------------------------------------------------------
[bar]
backend = "zebar"

[[bar.widgets]]
pack = "glzr-io.starter"
widget = "vanilla"
preset = "default"


# --------------------------------------------------------------------------
# Per-window rules, applied in order.
#
# Matchers: exe, class, title. Every matcher you set must match (AND); the
# ones you leave out match anything. Matching is case-insensitive and "*" is
# a wildcard, so you never have to write a regex. A trailing ".exe" on `exe`
# is optional.
#
# action = "tile" | "float" | "ignore"
#   float  keeps the window's own size and position
#   ignore leaves the window completely alone -- use it for overlays and
#          anything that must never be tiled
# workspace = "<name>" sends matching windows there when they appear.
# --------------------------------------------------------------------------

# Dialogs are the wrong shape for tiling.
[[rules]]
class = "#32770"
action = "float"

[[rules]]
exe = "Taskmgr"
action = "float"

# Overlays that draw over the whole screen must never be managed.
[[rules]]
class = "CEF-OSC-WIDGET"
action = "ignore"

[[rules]]
title = "*NVIDIA GeForce Overlay*"
action = "ignore"

# Example: keep your browser on workspace 2.
# [[rules]]
# exe = "chrome.exe"
# workspace = "2"


# --------------------------------------------------------------------------
# Shell and theme settings, applied through the registry.
#
# Only the keys you write here are ever touched. Delete a line and Baton
# stops managing that setting; it does not reset it.
# --------------------------------------------------------------------------
[windows]
dark_mode = true            # system UI (taskbar, Start)
app_dark_mode = true        # apps that honour the app theme
show_file_extensions = true
show_hidden_files = false
taskbar_small_icons = false
accent_color = "@palette.accent"
